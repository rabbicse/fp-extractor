name: CI
on:
  push:
    branches-ignore: [master, main]   # those run CI through deploy.yml
  pull_request:
  workflow_call:                       # reused by deploy.yml as its test gate

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        build_type: [Release, Debug]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -Wno-dev
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Unit, integration and REST API tests
        run: cd build && ctest --output-on-failure
      - name: Synthetic accuracy check
        if: matrix.build_type == 'Release'
        run: build/fpx eval --synthetic 20x3
      - name: Speed smoke test (100k gallery, 1 and 2 fingers)
        if: matrix.build_type == 'Release'
        run: |
          build/fpx bench --gallery 100000 --probes 10
          build/fpx bench --gallery 50000 --probes 10 --fingers 2

  go-gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: '1.22', cache: false }  # stdlib only, no go.sum
      - run: cd examples/go-gateway && go vet ./... && go build ./...

  deploy-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck deploy script
        run: shellcheck deploy/remote-deploy.sh
      - name: validate production compose file
        run: |
          cd deploy && touch .env
          FPX_IMAGE=example/image:tag docker compose -f docker-compose.prod.yml config -q

  docker-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build image (runs the test suite inside the build stage)
        run: docker build -f docker/Dockerfile -t fpx:ci .
      - name: Smoke test container, API and HEALTHCHECK
        run: |
          docker run -d --name fpx -p 8080:8080 -e FPX_API_KEY=ci fpx:ci
          for i in $(seq 1 60); do curl -fsS localhost:8080/healthz && break; sleep 2; done
          curl -fsS -H 'X-API-Key: ci' localhost:8080/v1/stats
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/stats)" = 401
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' fpx); echo "health: $s"
            [ "$s" = healthy ] && exit 0; sleep 5
          done
          docker logs fpx; exit 1
